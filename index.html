<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>qoolbie</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <a class="logo" href="index.html">q<span>oo</span>lbie</a>

  <div>
    <a href="yuyuhoon.html">Yuyuhoon</a>
    <a href="shop.html">Clover Shop</a>
    <a href="village.html">Village</a>
    <a href="stories.html">Stories</a>
    <a href="cart.html">
      Cart <span class="cart-count">0</span>
    </a>
  </div>
</nav>

<main>

  <section class="hero">

    <div>
      <span class="pill" id="home-welcome">
        Loading...
      </span>

      <h1 id="home-greeting">
        Loading...
      </h1>

      <p id="home-introduction">
        Loading...
      </p>

      <div class="buttons">
        <a class="btn" href="shop.html">visit the shop ☘</a>
        <a class="btn soft" href="stories.html">read stories</a>
      </div>
    </div>

    <div class="mascot">
      <img
        id="home-image"
        alt="Yuyu"
        style="max-width:100%;max-height:380px;width:auto;height:auto;object-fit:contain;"
      >
      <small>yuyu says hello!</small>
    </div>

  </section>

  <section class="home-cards">

    <a href="yuyuhoon.html">
      <b>🌱 meet yuyuhoon</b>
      <span id="home-yuyuhoon"></span>
    </a>

    <a href="shop.html">
      <b>🛍️ clover shop</b>
      <span id="home-shop"></span>
    </a>

    <a href="stories.html">
      <b>📖 village stories</b>
      <span id="home-stories"></span>
    </a>

  </section>

</main>

<footer>qoolbie ☘</footer>

<script src="script.js"></script>

<script>

async function loadHome() {

  try {

    const response = await fetch(
      "https://raw.githubusercontent.com/qoolbie/Qoolbie/main/content/home.json?cache=" + Date.now()
    );

    const home = await response.json();

    document.getElementById("home-welcome").textContent =
      home.welcome || "";

    document.getElementById("home-greeting").textContent =
      home.greeting || "";

    document.getElementById("home-introduction").textContent =
      home.introduction || "";

    document.getElementById("home-yuyuhoon").textContent =
      home.yuyuhoonText || "";

    document.getElementById("home-shop").textContent =
      home.shopText || "";

    document.getElementById("home-stories").textContent =
      home.storiesText || "";

    const savedImage = home.image || home.ima;

    if (savedImage) {

      let imagePath = savedImage;

      if (!imagePath.startsWith("http")) {
        imagePath =
          "https://qoolbie.github.io/Qoolbie" +
          imagePath;
      }

      document.getElementById("home-image").src =
        imagePath + "?cache=" + Date.now();

    }

  } catch (error) {

    console.error("Could not load Home:", error);

  }

}

loadHome();

</script>

</body>
</html>
