media:
  input: media
  output: /media
  categories: [image]

content:
  - name: products
    label: Products
    type: collection
    path: content/products
    format: json
    fields:
      - name: name
        label: Product Name
        type: string
      - name: price
        label: Price
        type: number
      - name: image
        label: Product Image
        type: image
      - name: description
        label: Description
        type: string
      - name: details
        label: More Details
        type: text
      - name: available
        label: Available
        type: boolean

  - name: stories
    label: Stories
    type: collection
    path: content/stories
    format: json
    fields:
      - name: title
        label: Story Title
        type: string
      - name: date
        label: Date
        type: date
      - name: image
        label: Story Image
        type: image
      - name: content
        label: Story
        type: text
      - name: published
        label: Published
        type: boolean

  - name: yuyuhoon
    label: Yuyuhoon
    type: file
    path: content/yuyuhoon.json
    format: json
    fields:
      - name: ima
        label: Yuyuhoon Image
        type: image
      - name: subtitle
        label: Subtitle
        type: string
      - name: introduction
        label: Introduction
        type: text
      - name: facts
        label: Facts
        type: text

  - name: village
    label: Village
    type: file
    path: content/village.json
    format: json
    fields:
      - name: image
        label: Village Image
        type: image
      - name: subtitle
        label: Subtitle
        type: string
      - name: introduction
        label: Introduction
        type: text
      - name: description
        label: Description
        type: text

  - name: home
    label: Home
    type: file
    path: content/home.json
    format: json
    fields:
      - name: image
        label: Yuyu Image
        type: image
      - name: welcome
        label: Welcome Label
        type: string
      - name: greeting
        label: Greeting
        type: string
      - name: introduction
        label: Introduction
        type: text
      - name: mascotText
        label: Mascot Text
        type: string
      - name: shopButton
        label: Shop Button
        type: string
      - name: storiesButton
        label: Stories Button
        type: string
      - name: yuyuhoonTitle
        label: Yuyuhoon Card Title
        type: string
      - name: yuyuhoonText
        label: Yuyuhoon Card Text
        type: string
      - name: shopTitle
        label: Shop Card Title
        type: string
      - name: shopText
        label: Shop Card Text
        type: string
      - name: storiesTitle
        label: Stories Card Title
        type: string
      - name: storiesText
        label: Stories Card Text
        type: string
