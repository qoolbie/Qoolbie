<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout — qoolbie</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <a class="logo" href="index.html">q<span>oo</span>lbie</a>
  <div>
    <a href="shop.html">Clover Shop</a>
    <a href="cart.html">Cart <span class="cart-count">0</span></a>
  </div>
</nav>

<main class="page">

  <span class="pill">☘ sleepy checkout</span>
  <h1>checkout</h1>

  <div class="checkout">

    <form id="checkoutForm" class="card">

      <h2>Where should we send it?</h2>

      <label>
        Name
        <input required name="name" placeholder="Your name">
      </label>

      <label>
        Email
        <input required type="email" name="email" placeholder="you@example.com">
      </label>

      <label>
        Address
        <textarea required name="address" placeholder="Shipping address"></textarea>
      </label>

      <label>
        City
        <input required name="city" placeholder="City">
      </label>

      <label>
        Postcode
        <input required name="postcode" placeholder="Postcode">
      </label>

      <h2>Shipping</h2>

      <label>
        <input type="radio" name="shipping" value="standard" data-price="3.50" checked>
        Standard — £3.50
      </label>

      <label>
        <input type="radio" name="shipping" value="tracked" data-price="5.50">
        Tracked — £5.50
      </label>

      <label>
        <input type="radio" name="shipping" value="express" data-price="8.50">
        Express — £8.50
      </label>

      <label>
        Shipping company
        <select required name="shippingCompany">
          <option value="">Choose a company</option>
          <option value="Royal Mail">Royal Mail</option>
          <option value="Evri">Evri</option>
          <option value="DPD">DPD</option>
        </select>
      </label>

      <p class="notice">
        ☘ This is still a test checkout.
        Don't enter real payment or card details.
      </p>

      <label>
        <input required type="checkbox" name="testOrder">
        I understand this is a pretend/test order.
      </label>

      <button class="btn" type="submit">
        place pretend order ☘
      </button>

    </form>

    <aside class="card">

      <h2>Order summary</h2>

      <div id="summary"></div>

    </aside>

  </div>

</main>

<footer>qoolbie ☘</footer>

<script src="script.js?v=6"></script>

<script>

const SUPABASE_URL = "https://fnvmtifspfdlclekbhcw.supabase.co";

/*
  Paste your Supabase PUBLISHABLE KEY between the quotation marks below.

  It should start with:
  sb_publishable_
*/
const SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";


function getShipping() {

  const selected = document.querySelector(
    'input[name="shipping"]:checked'
  );

  if (!selected) {
    return {
      method: "standard",
      fee: 3.50
    };
  }

  return {
    method: selected.value,
    fee: Number(selected.dataset.price)
  };
}


function getCurrentCart() {

  if (typeof getCart === "function") {
    return getCart();
  }

  try {
    return JSON.parse(localStorage.getItem("qoolbieCart")) || [];
  } catch {
    return [];
  }
}


function calculateSubtotal(cart) {

  return cart.reduce(function(total, item) {

    const price = Number(item.price) || 0;
    const quantity = Number(item.quantity) || 1;

    return total + (price * quantity);

  }, 0);

}


function updateSummary() {

  const cart = getCurrentCart();
  const shipping = getShipping();
  const subtotal = calculateSubtotal(cart);
  const total = subtotal + shipping.fee;

  const summary = document.getElementById("summary");

  if (!cart.length) {

    summary.innerHTML = `
      <p>Your basket is empty.</p>
      <a class="btn" href="shop.html">go to shop ☘</a>
    `;

    return;
  }

  summary.innerHTML = `
    <p><strong>Items:</strong> ${cart.length}</p>
    <p><strong>Subtotal:</strong> £${subtotal.toFixed(2)}</p>
    <p><strong>Shipping:</strong> £${shipping.fee.toFixed(2)}</p>
    <hr>
    <p><strong>Total:</strong> £${total.toFixed(2)}</p>
  `;

}


document.querySelectorAll('input[name="shipping"]').forEach(function(input) {

  input.addEventListener("change", updateSummary);

});


updateSummary();


document.getElementById("checkoutForm").addEventListener("submit", async function(event) {

  event.preventDefault();

  const form = event.target;
  const cart = getCurrentCart();

  if (!cart.length) {
    alert("Your basket is empty ☘");
    return;
  }

  if (
    !SUPABASE_PUBLISHABLE_KEY ||
    SUPABASE_PUBLISHABLE_KEY === "PASTE_YOUR_PUBLISHABLE_KEY_HERE"
  ) {
    alert("The Supabase publishable key has not been added yet.");
    return;
  }

  const shipping = getShipping();
  const subtotal = calculateSubtotal(cart);
  const total = subtotal + shipping.fee;

  const formData = new FormData(form);

  const order = {

    customer_name: formData.get("name"),
    email: formData.get("email"),
    address: formData.get("address"),
    city: formData.get("city"),
    postcode: formData.get("postcode"),

    shipping_method: shipping.method,
    shipping_company: formData.get("shippingCompany"),

    items: cart,

    subtotal: Number(subtotal.toFixed(2)),
    shipping_fee: Number(shipping.fee.toFixed(2)),
    total: Number(total.toFixed(2))

  };


  const button = form.querySelector("button[type='submit']");

  button.disabled = true;
  button.textContent = "saving order... ☘";


  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/Orders",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_PUBLISHABLE_KEY,
          "Authorization": "Bearer " + SUPABASE_PUBLISHABLE_KEY,
          "Prefer": "return=minimal"
        },

        body: JSON.stringify(order)
      }
    );


    if (!response.ok) {

      const errorText = await response.text();

      console.error("Supabase error:", errorText);

      throw new Error("Order could not be saved.");

    }


    localStorage.removeItem("qoolbieCart");


    document.querySelector(".checkout").innerHTML = `

      <div class="card success">

        <div>🐨💤☘</div>

        <h2>Order received!</h2>

        <p>
          Yuyuhoon has safely saved your pretend order.
        </p>

        <p>
          Shipping: ${shipping.method} with ${formData.get("shippingCompany")}
        </p>

        <p>
          Total: £${total.toFixed(2)}
        </p>

        <a class="btn" href="index.html">
          back to qoolbie
        </a>

      </div>

    `;

  } catch (error) {

    console.error(error);

    alert(
      "Sorry! The test order could not be saved. Please check the Supabase setup."
    );

    button.disabled = false;
    button.textContent = "place pretend order ☘";

  }

});

</script>

</body>
</html>
