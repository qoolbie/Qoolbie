<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yuyuhoon — qoolbie</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <a class="logo" href="index.html">q<span>oo</span>lbie</a>

  <div>
    <a href="yuyuhoon.html">Yuyuhoon</a>
    <a href="shop.html">Clover Shop</a>
    <a href="village.html">Village</a>
    <a href="stories.html">Stories</a>
    <a href="cart.html">
      Cart <span class="cart-count">0</span>
    </a>
  </div>
</nav>

<main class="page">

  <span class="pill">☘ meet yuyuhoon</span>

  <h1>yuyuhoon</h1>

  <p class="subtitle" id="yuyu-subtitle">
    Loading...
  </p>

  <div class="two">

    <div class="big-mascot">
      <img
        id="yuyu-image"
        src=""
        alt="Yuyuhoon"
        style="max-width:100%;max-height:380px;width:auto;height:auto;object-fit:contain;"
      >
    </div>

    <div>

      <h2>hello!</h2>

      <p id="yuyu-introduction">
        Loading Yuyuhoon...
      </p>

      <div class="facts" id="yuyu-facts"></div>

    </div>

  </div>

</main>

<footer>qoolbie ☘</footer>

<script src="script.js"></script>

<script>

async function loadYuyuhoon() {

  try {

    const response = await fetch(
      "https://raw.githubusercontent.com/qoolbie/Qoolbie/main/content/yuyuhoon.json"
    );

    const yuyu = await response.json();

    document.getElementById("yuyu-subtitle").textContent =
      yuyu.subtitle || "";

    document.getElementById("yuyu-introduction").textContent =
      yuyu.introduction || "";

    const image = document.getElementById("yuyu-image");

    if (yuyu.image) {

      image.src = yuyu.image.startsWith("http")
        ? yuyu.image
        : "https://raw.githubusercontent.com/qoolbie/Qoolbie/main" + yuyu.image;

    }

    const facts = yuyu.facts || "";

    document.getElementById("yuyu-facts").innerHTML =
      facts
        .split("\n")
        .filter(fact => fact.trim() !== "")
        .map(fact => `<span>${fact}</span>`)
        .join("");

  } catch (error) {

    console.error("Could not load Yuyuhoon:", error);

  }

}

loadYuyuhoon();

</script>

</body>
</html>
